<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>马楠：古玩夜行</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:#f3e9cf;font-family:system-ui}#wrap{max-width:1200px;margin:auto;position:relative}canvas{width:100%;display:block;aspect-ratio:16/9;background:#172747;touch-action:none}#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101729b8;padding:20px}article{background:#15243eea;border:1px solid #c1a677;padding:clamp(18px,4vw,42px);max-width:600px;box-shadow:0 10px 60px #0008}h1{font-size:clamp(26px,5vw,52px);margin:0 0 12px;letter-spacing:.15em}p{line-height:1.8}button{background:#efe3c8;border:0;color:#192f50;padding:12px 22px;font-size:16px;font-weight:bold;cursor:pointer}#touch{display:flex;justify-content:space-between;padding:12px;gap:8px;touch-action:none}#touch div{display:flex;gap:8px}#touch button{border-radius:50%;width:58px;height:58px;padding:0;background:#425b80;color:white;user-select:none}small{display:block;text-align:center;color:#c9d3df;padding:4px}</style><div id="wrap"><canvas id="c" width="960" height="540"></canvas><div id="panel"><article><h1>马楠：古玩夜行</h1><p id="msg">雨夜，一位客人带来一只裂开的青花瓶。每到半夜，瓶里都会传来水声。<br>马楠刚碰到裂纹，眼前的山水画便活了过来……</p><button id="start">接受委托 · 进入瓶中</button><p>移动 A / D 或方向键　跳跃 W / 空格<br>攻击 J　重击 K　闪避 Shift　支持手柄操作</p></article></div><small>第一章 · 瓶中山水 ｜ 寻找碎片，唤醒并击败瓶中画师</small></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),panel=document.getElementById('panel'),msg=document.getElementById('msg'),start=document.getElementById('start');let bg=new Image;bg.src='world.png';let keys={},pressed={},state='intro',t=0,cam=0,frags=0,shake=0;const floor=440,world=3000;let p, enemies, boss, drops, shots=[];
function reset(){p={x:80,y:floor-52,vx:0,vy:0,w:28,h:52,hp:6,face:1,inv:0,cd:0,dash:0,ground:true};enemies=[600,1000,1500,1900].map((v,i)=>({x:v,y:floor-34,hp:3,dir:i%2?1:-1,cd:0,alive:true}));drops=[{x:800,taken:false},{x:1350,taken:false},{x:2050,taken:false}];boss={x:2670,hp:24,max:24,cd:80,alive:true};shots=[];frags=0;cam=0;state='play';panel.style.display='none'}start.onclick=reset;
const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',w:'jump',' ':'jump',j:'attack',k:'heavy',Shift:'dash'};onkeydown=e=>{let k=map[e.key];if(k){e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true}};onkeyup=e=>{let k=map[e.key];if(k)keys[k]=false};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys[k])pressed[k]=true;keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});
function hitPlayer(d=1){if(p.inv||p.dash)return;p.hp-=d;p.inv=70;shake=12;if(p.hp<=0){state='dead';msg.innerHTML='瓶中的山水渐渐模糊……<br>马楠在店里醒来，青花瓶仍在桌上。再试一次吧。';start.textContent='重新进入';panel.style.display='flex'}}
function action(type){if(p.cd)return;p.cd=type==='heavy'?42:18;let reach=type==='heavy'?90:65,damage=type==='heavy'?3:1;for(let e of [...enemies,boss]){if(e.alive&&Math.abs(e.x-p.x)<reach&&Math.sign(e.x-p.x)===p.face&&Math.abs((e.y||floor-80)-p.y)<110){if(e===boss&&frags<3)continue;e.hp-=damage;shake=type==='heavy'?9:4;if(e.hp<=0){e.alive=false;if(e===boss){state='win';msg.innerHTML='墨色散去，画师留下最后一幅完整的山水。<br>马楠带着三片瓷片回到店中，细细修补裂纹。天亮时，瓶里终于不再传来水声。<br><br>第一章 · 完';start.textContent='再玩一次';panel.style.display='flex'}}}}}
function update(){if(state!=='play')return;t++;let gp=navigator.getGamepads?.()[0];let axis=gp?.axes[0]||0;let left=keys.left||axis<-.3,right=keys.right||axis>.3;function once(name,btn){let v=!!gp?.buttons[btn]?.pressed;let k='gp'+btn;let r=pressed[name]||(v&&!keys[k]);keys[k]=v;return r}if(left!==right){p.face=right?1:-1;p.vx=(right?1:-1)*3.5}else p.vx*=.75;if(once('dash',1)&&!p.dash&&p.inv<50){p.dash=14;p.inv=25}if(p.dash){p.vx=p.face*9;p.dash--}if(once('jump',0)&&p.ground){p.vy=-12;p.ground=false}if(once('attack',2))action('attack');if(once('heavy',3))action('heavy');p.x=Math.max(0,Math.min(world-30,p.x+p.vx));p.vy+=.55;p.y+=p.vy;if(p.y>=floor-p.h){p.y=floor-p.h;p.vy=0;p.ground=true}p.inv=Math.max(0,p.inv-1);p.cd=Math.max(0,p.cd-1);cam=Math.max(0,Math.min(world-960,p.x-280));for(let d of drops)if(!d.taken&&Math.abs(p.x-d.x)<35){d.taken=true;frags++}for(let e of enemies){if(!e.alive)continue;e.x+=e.dir*.8;if(Math.abs(e.x-p.x)<180)e.dir=Math.sign(p.x-e.x)||1;if(Math.abs(e.x-p.x)<28&&Math.abs(e.y-p.y)<42)hitPlayer();}if(boss.alive&&p.x>2200){boss.cd--;if(boss.cd<0){shots.push({x:boss.x,y:floor-55,v:-4});boss.cd=70}if(Math.abs(boss.x-p.x)<35)hitPlayer()}for(let s of shots){s.x+=s.v;if(Math.abs(s.x-p.x)<24&&Math.abs(s.y-p.y)<40){hitPlayer();s.x=-100}}shots=shots.filter(s=>s.x>cam-200);pressed={}}
function draw(){x.clearRect(0,0,960,540);if(bg.complete&&bg.naturalWidth){x.drawImage(bg,0,0,960,540)}else{x.fillStyle='#446491';x.fillRect(0,0,960,540)}x.fillStyle='#122b52aa';x.fillRect(0,0,960,540);x.save();if(shake){x.translate(Math.random()*shake-shake/2,0);shake--}x.translate(-cam,0);x.fillStyle='#d9e6e5';x.fillRect(0,floor,world,100);x.fillStyle='#356395';x.fillRect(0,floor+8,world,10);for(let i=0;i<world;i+=55){x.strokeStyle='#356395';x.lineWidth=3;x.strokeRect(i+8,floor+27,30,24);x.beginPath();x.arc(i+23,floor+39,8,0,7);x.stroke()}for(let d of drops)if(!d.taken){x.fillStyle='#fceab4';x.beginPath();x.arc(d.x,390+Math.sin(t/15)*5,8,0,7);x.fill();x.fillStyle='#235f9b';x.fillRect(d.x-2,385+Math.sin(t/15)*5,4,10)}for(let e of enemies)if(e.alive){x.fillStyle='#dce9ed';x.fillRect(e.x-16,e.y,32,34);x.fillStyle='#255a91';x.fillRect(e.x-12,e.y+9,24,5);x.fillStyle='#e4aa67';x.fillRect(e.x-9,e.y+3,5,5);x.fillRect(e.x+5,e.y+3,5,5)}if(boss.alive){x.fillStyle='#182e4e';x.fillRect(boss.x-30, floor-100,60,100);x.fillStyle='#e5e5d7';x.fillRect(boss.x-20,floor-112,40,30);x.fillStyle='#285b8a';x.fillRect(boss.x-24,floor-63,48,7);x.fillStyle='#e6b869';x.fillRect(boss.x-60,floor-85,35,6)}for(let s of shots){x.fillStyle='#8bd3ef';x.beginPath();x.arc(s.x,s.y,10,0,7);x.fill()}if(!p.inv||t%8<4){x.fillStyle='#243044';x.fillRect(p.x-12,p.y+18,24,25);x.fillRect(p.x-11,p.y+42,8,10);x.fillRect(p.x+4,p.y+42,8,10);x.fillStyle='#d5aa83';x.fillRect(p.x-10,p.y,20,20);x.fillStyle='#101d31';x.fillRect(p.x-11,p.y-3,22,8);x.fillStyle='#dbb874';x.fillRect(p.x+(p.face>0?10:-26),p.y+25,16,4);if(p.cd>10){x.strokeStyle='#fff1bd';x.lineWidth=5;x.beginPath();x.arc(p.x,p.y+22,44,p.face>0?-.7:2.4,p.face>0?.7:3.9);x.stroke()}}x.restore();x.fillStyle='#10213ed9';x.fillRect(15,15,270,72);x.fillStyle='#fff';x.font='20px sans-serif';x.fillText('生命 '+ '◆'.repeat(Math.max(0,p.hp)),28,42);x.font='16px sans-serif';x.fillText('青花碎片 '+frags+' / 3',28,70);if(p.x>2200&&boss.alive){x.fillStyle='#12213cdd';x.fillRect(295,15,380,55);x.fillStyle='#fff';x.fillText(frags<3?'瓶中画师 · 寻齐三片碎片才能破除护罩':'瓶中画师',310,37);x.fillStyle='#c9a36a';x.fillRect(310,48,340*boss.hp/boss.max,8)}x.fillStyle='#fff';x.font='15px sans-serif';x.fillText('向右探索 · 收集碎片',700,40)}
reset();state='intro';panel.style.display='flex';function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></html>
