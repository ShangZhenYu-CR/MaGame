<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>马楠 · 鬼剑传</title><link rel="stylesheet" href="./client/style.css"></head><body>
<header><div><small>GHOST SWORD / PAGES 试玩版</small><h1>马楠 · 鬼剑传</h1></div><span id="status">正在连接列车…</span></header>
<section id="storage" hidden role="alert"><b id="storageMessage"></b> <button id="storageRetry" hidden>从已提交存档恢复</button></section><section id="login"><h2>一张单程车票</h2><p>角色、战利品与交易保存在本机服务中。不同角色共用同一个拍卖行。</p><div id="localProfiles"></div><form id="create"><input name="name" maxlength="20" required placeholder="角色名"><button>创建角色</button></form><details><summary>使用角色钥匙登录</summary><form id="signin"><input name="token" required placeholder="粘贴角色钥匙"><button>登录</button></form></details></section>
<main id="main" hidden><div id="profile"></div><nav id="nav"></nav><section id="town"></section><section id="battle" hidden><div class="battle-tools"><b id="room"></b><button id="pause">暂停 / 继续 Esc</button><button id="retry">死亡续战</button><button id="reset">重置训练</button><button id="exit">结束副本回城</button></div><canvas id="canvas" width="960" height="540" tabindex="0"></canvas><div id="skills"></div><p class="help" id="battleHelp">方向键移动 / 双击奔跑　X 普攻　C 跳跃、倒地受身　V 格挡　空格 后跳、受击脱身　Q 抓取<br>Z 顶点挑斩　A 三重影袭　S 幽魂剑气　D 陨星坠　F 冥火结界　G 万面修罗　1 恢复药　2 净化药</p><div id="battleInfo"></div></section></main>
<section id="training" hidden><h3>训练工具（隔离正式资产）</h3><div class="row"><select id="targetType"><option value="normal">普通木桩</option><option value="heavy">重甲木桩</option><option value="armor">霸体木桩</option><option value="king">金刚体木桩</option><option value="shield">500护盾木桩</option><option value="boss">Boss木桩</option></select><button id="targetApply">更换木桩</button><select id="buildType"><option value="air">追空构筑</option><option value="break">破韧构筑</option><option value="zone">结界构筑</option></select><button id="buildApply">试用构筑</button><select id="hardType"><option value="stun">晕眩</option><option value="freeze">冻结</option><option value="stone">石化</option><option value="sleep">睡眠</option></select><button id="hardApply">施加60F控制</button><label>动作速度 <input id="trainSpeed" type="number" min="0.75" max="1.35" step="0.05" value="1"></label><button id="speedApply">应用速度</button><label><input id="hitstop" type="checkbox">关闭命中停顿</label><label><input id="boxes" type="checkbox">受击框</label><label><input id="attackBoxes" type="checkbox">攻击框</label><label><input id="bodyBoxes" type="checkbox">身体范围</label><button id="step">暂停逐帧</button><button id="stress">压力场景：20单位 / 100弹体 / 3结界</button></div><p id="targetStats"></p><p id="cancelInfo"></p><div id="trainLoadout"></div></section>
<dialog id="confirmDialog"><form method="dialog"><h3 id="confirmTitle"></h3><input id="confirmValue" hidden><div class="row"><button value="cancel">取消</button><button value="ok" class="primary">确认</button></div></form></dialog><div id="toast" role="status"></div><footer>电脑端 · 1.2 功能粗稿版 · 美术与数值继续打磨</footer><script type="importmap">{"imports":{"#runtime":"./browser/runtime.js"}}</script><script type="module" src="./client/app.js"></script></body></html>
