<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1520">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23ea7a30' d='M7 1h3v5h3v6h-2v2H5v-2H3V7h4z'/%3E%3C/svg%3E">
  <title>马楠：霜云方舟</title>
  <script type="module" crossorigin src="./dist/assets/main-CMCZrLw2.js"></script>
  <link rel="stylesheet" crossorigin href="./dist/assets/main-DGsL8V25.css">
</head>
<body>
<main id="app" aria-label="马楠：霜云方舟">
  <canvas id="game-canvas" aria-label="霜云方舟甲板与云海"></canvas>
  <header id="hud-card" class="hud-card">
    <img id="manan-portrait" alt="马楠">
    <div><div class="eyebrow">FROST ARK <span>／</span> 初航记录</div>
      <h1>马楠：霜云方舟</h1><div id="hud-stats" class="numbers"></div>
    </div>
  </header>
  <aside class="sector"><div class="eyebrow">SKY SECTOR <span>01</span></div><strong>碎云浅海</strong><div>风向　东偏南</div></aside>
  <section class="field-status">
    <div id="action" role="status">余烬还在。先从云里捞点木头。</div>
    <div id="hint">按住左键蓄力，松开抛钩</div>
    <div class="meter" id="meter" hidden><div id="charge-bar"></div></div>
  </section>
  <nav class="toolbar" aria-label="方舟操作">
    <button type="button" id="hook" aria-pressed="true"><kbd>Q</kbd> 抓钩</button>
    <button type="button" id="build-deck" aria-pressed="false"><kbd>1</kbd> 甲板</button>
    <button type="button" id="build-torch" aria-pressed="false"><kbd>2</kbd> 火把</button>
    <button type="button" id="bag" aria-expanded="false"><kbd>I</kbd> 背包</button>
  </nav>
  <aside id="inventory" class="inventory" aria-label="背包" hidden>
    <div class="panel-head"><div><div class="eyebrow">FIELD PACK</div><h2>背包</h2></div><button id="close" type="button" aria-label="关闭背包">关闭</button></div>
    <ul id="stacks"></ul>
    <section class="craft"><p>手制火把 <small>浮木板 ×2　旧缆绳 ×1</small></p><button type="button" id="craft-torch">制作 ×2</button></section>
    <footer><button id="export" type="button">导出 JSON</button><button id="import" type="button">导入 JSON</button><input type="file" id="save-file" accept=".json,application/json" hidden></footer>
  </aside>
  <aside id="storage-panel" class="inventory storage" aria-label="储物箱" hidden>
    <div class="panel-head"><div><div class="eyebrow">ARK LOCKER</div><h2>储物箱</h2></div><button id="storage-close" type="button" aria-label="关闭储物箱">关闭</button></div>
    <h3>箱内 <span id="storage-count" class="numbers"></span></h3>
    <ul id="storage-stacks"></ul><h3>背包</h3><ul id="storage-deposit"></ul>
  </aside>
  <div class="build-note" id="build-note" hidden></div>
  <div class="save-label" id="save-label" role="status">读取存档…</div>
  <div class="key-note"><kbd>WASD</kbd> 移动 <span>／</span> <kbd>E</kbd> 储物箱 <span>／</span> <kbd>Esc</kbd> 返回</div>
</main>
</body>
</html>
