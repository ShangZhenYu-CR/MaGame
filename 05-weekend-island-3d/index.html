<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>马楠的周末</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
.pe{pointer-events:auto}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.show{opacity:1}
.pill{background:rgba(24,20,40,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:8px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
#hp span{color:#ff6b7a;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .2s}#hp span.off{color:rgba(255,255,255,.25)}
#its span{font-size:22px;opacity:.28;filter:grayscale(1);transition:all .3s}#its span.got{opacity:1;filter:none;transform:scale(1.1)}
#cn::before{content:"✦ ";color:#ffd86a}#tm{font-variant-numeric:tabular-nums;opacity:.85;font-size:14px}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);font-size:34px;font-weight:900;letter-spacing:6px;text-shadow:0 3px 0 rgba(40,20,60,.35),0 0 24px rgba(40,20,60,.35);opacity:0;transition:all .5s;pointer-events:none;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%) translateY(-8px);background:rgba(24,20,40,.72);padding:10px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translate(-50%,10px);background:#fffaf0;color:#3a2e2a;border-radius:18px;padding:12px 18px 14px;min-width:240px;max-width:min(460px,80vw);box-shadow:0 6px 0 rgba(40,20,60,.25);opacity:0;transition:all .3s;pointer-events:none}
#dlg.show{opacity:1;transform:translate(-50%,0)}#dlgn{font-size:12px;font-weight:800;color:#d8584a;margin-bottom:4px}#dlgt{font-size:16px;line-height:1.5}
#bossbar{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);width:min(420px,60vw);pointer-events:none;text-align:center;font-weight:800;font-size:13px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#bossbar .bar{height:12px;border-radius:6px;background:rgba(0,0,0,.35);margin-top:5px;overflow:hidden;border:2px solid rgba(255,255,255,.5)}#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff5a6a,#ffb04a);transition:width .3s}
#ctrl{position:fixed;inset:0;pointer-events:none;display:none}#ctrl.show{display:block}
.btn{position:fixed;border-radius:50%;border:0;font:800 17px system-ui,sans-serif;color:#3a2e2a;pointer-events:auto;box-shadow:0 5px 0 rgba(40,20,60,.3);transition:transform .08s,filter .08s;touch-action:none}
.btn.on{transform:scale(.92) translateY(3px);filter:brightness(1.1);box-shadow:0 2px 0 rgba(40,20,60,.3)}
#bJump{right:calc(env(safe-area-inset-right) + 30px);bottom:calc(env(safe-area-inset-bottom) + 34px);width:96px;height:96px;background:#ffd86a}
#bDash{right:calc(env(safe-area-inset-right) + 140px);bottom:calc(env(safe-area-inset-bottom) + 44px);width:72px;height:72px;background:#8ad0f0;display:none}#bDash.show{display:block}
#joy{display:none;position:fixed;width:124px;height:124px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);pointer-events:none}
#joyk{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.2)}
#bMute{position:fixed;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 150px);width:40px;height:40px;border-radius:50%;border:0;background:rgba(24,20,40,.45);color:#fff;font-size:18px;pointer-events:auto;z-index:5}
#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:24px 24px calc(env(safe-area-inset-bottom) + 36px);background:linear-gradient(rgba(30,20,50,0) 40%,rgba(30,20,50,.78) 78%);transition:opacity .6s}
#title.hide{opacity:0;pointer-events:none}
#title h1{margin:0;font-size:46px;font-weight:900;letter-spacing:6px;text-shadow:0 4px 0 rgba(40,20,60,.4)}
#title .sub{margin:6px 0 14px;font-size:15px;letter-spacing:3px;opacity:.9}
#title .feat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px;margin-bottom:6px}
#title .feat span{background:rgba(255,255,255,.16);border-radius:12px;padding:6px 10px;font-size:13px}
#title .how{font-size:12px;opacity:.75;margin-top:8px;line-height:1.6}
.big{margin-top:16px;font:900 21px system-ui,sans-serif;color:#3a2e2a;background:#ffd86a;border:0;border-radius:20px;padding:15px 46px;box-shadow:0 6px 0 rgba(40,20,60,.35);pointer-events:auto}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(40,20,60,.35)}
#fade{position:fixed;inset:0;background:#1a1426;opacity:0;pointer-events:none;transition:opacity .4s}#fade.show{opacity:1}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s;background:rgba(30,20,50,.35)}
#end.show{opacity:1;pointer-events:auto}
.card{background:#fffaf0;color:#3a2e2a;border-radius:26px;padding:22px 28px 26px;text-align:center;width:min(380px,86vw);box-shadow:0 10px 0 rgba(40,20,60,.3)}
.photo{width:120px;height:138px;margin:-70px auto 6px;border-radius:22px;background-color:#ffe3a8;background-size:400% 100%;background-position:33.333% 0;border:5px solid #fff;box-shadow:0 6px 0 rgba(40,20,60,.2)}
.card h2{margin:6px 0 2px;font-size:28px}#stars{font-size:38px;letter-spacing:6px;margin:6px 0}#stars span{color:#e0d6c6}#stars span.on{color:#ffb82a;text-shadow:0 3px 0 #d88a1a}
#estat{font-size:15px;line-height:1.8}#estat small{display:block;color:#9a8a80;font-size:11px;margin-top:4px}
.slogan{margin-top:10px;font-weight:800;color:#d8584a;letter-spacing:3px}
#keys{position:fixed;left:calc(env(safe-area-inset-left) + 14px);bottom:14px;font-size:12px;background:rgba(24,20,40,.45);padding:7px 12px;border-radius:12px;pointer-events:none;display:none;letter-spacing:.5px}#keys.show{display:block}#keys b{color:#ffd86a}
#lockhint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:13px;background:rgba(24,20,40,.6);padding:7px 14px;border-radius:12px;pointer-events:none;display:none}#lockhint.show{display:block}
#bMute{bottom:calc(env(safe-area-inset-bottom) + 50px) !important;right:auto !important;left:calc(env(safe-area-inset-left) + 14px)}
#err{position:fixed;left:8px;right:8px;bottom:8px;color:#fff;background:#a33;padding:8px;font:12px monospace;white-space:pre-wrap;z-index:99;display:none;max-height:40vh;overflow:auto}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#cfe8ff;color:#3a2e2a;font-weight:800;letter-spacing:3px;z-index:50;transition:opacity .5s}
</style></head><body>
<div id="load">马楠正在起床…</div>
<div id="hud"><div class="pill" id="hp"></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end"><div class="pill"><span id="its"></span></div><div class="pill"><span id="cn">0</span><span id="tm">0:00</span></div></div></div>
<div id="banner"></div><div id="toast"></div>
<div id="dlg"><div id="dlgn"></div><div id="dlgt"></div></div>
<div id="bossbar">周一大魔王<div class="bar"><div id="bossfill"></div></div></div>
<div id="ctrl"><button class="btn" id="bJump">跳</button><button class="btn" id="bDash">冲刺</button></div>
<div id="joy"><div id="joyk"></div></div>
<button id="bMute">🔊</button>
<div id="keys"><b>WASD</b> 移动　<b>空格</b> 跳（空中按住滑翔）　<b>Shift</b> 冲刺　<b>鼠标</b> 视角　<b>滚轮</b> 远近　<b>M</b> 静音</div>
<div id="lockhint">点击画面锁定鼠标视角 · Esc 释放</div>
<div id="title"><h1>马楠的周末</h1><div class="sub">踏实做事 · 好好生活</div>
<div class="feat"><span>🍚 早餐街 · 外卖车平台</span><span>☕ 咖啡屋顶 · 冲刺</span><span>📦 快递站 · 传送带与塌板</span><span>💐 花市 · 小黄伞滑翔</span><span>🏀 Boss · 周一大魔王</span></div>
<button class="big" id="bStart">开始周末</button>
<div class="how">WASD 移动 · 鼠标转视角（点击画面锁定，Esc 释放）· 空格跳，空中按住滑翔 · Shift 冲刺 · 滚轮调镜头远近<br>也支持触屏：左半屏拖动走路，右半屏拖动转视角</div></div>
<div id="fade"></div>
<div id="end"><div class="card"><div class="photo" id="photo"></div><h2>周末圆满</h2><div id="stars"></div><div id="estat"></div><div class="slogan">踏实做事，好好生活。</div><button class="big" id="bAgain">再过一个周末</button></div></div>

function frame(t){requestAnimationFrame(frame);try{const rdt=Math.min(.05,(t-last)/1000||.016);last=t;
 // 自适应画质
 ftAcc+=rdt;ftN++;if(ftAcc>2){const avg=ftAcc/ftN;if(avg>(isTouch?.022:.03)&&curPR>1){curPR=Math.max(1,curPR-.15);renderer.setPixelRatio(curPR);resize()}else if(avg<.0145){ftLow++;if(ftLow>2&&curPR<maxPR){curPR=Math.min(maxPR,curPR+.1);renderer.setPixelRatio(curPR);resize();ftLow=0}}else ftLow=0;ftAcc=0;ftN=0}
 let dt=rdt;if(hitstop>0){hitstop-=rdt;dt*=.05}dt*=slowmo;T+=dt;
 if(game==='play'){readInput(rdt);acc+=dt;let n=0;while(acc>=FIX&&n<10){fixedStep(FIX);acc-=FIX;n++}if(n>=10)acc=0;playUpdate(dt)}
 else{updateDynamics(dt);enemyStep(dt)}
 // 角色朝向与动画
 const sp=Math.hypot(P.vel.x,P.vel.z);let turn=0;if(sp>.5&&game==='play'){const want=Math.atan2(-P.vel.x,-P.vel.z),d=angDiff(P.yaw,want);const step=d*(1-Math.exp(-14*dt));turn=step/Math.max(dt,1e-4);P.yaw+=step}
 HERO.root.position.copy(P.pos);HERO.root.rotation.y=P.yaw;HERO.root.visible=!(P.inv>0&&game==='play'&&Math.floor(P.inv*14)%2===0);
 HERO.update(dt,{speed01:clamp(sp/MAXV,0,1),grounded:P.grounded||game!=='play',vy:P.vel.y,glide:P.glide,dash:P.dashT>0,turn,time:T});
 HERO.sh.position.set(P.pos.x,surfaceY(P.pos.x,P.pos.z,P.pos.y+.1)+.03,P.pos.z);const hgt=P.pos.y-HERO.sh.position.y;HERO.sh.scale.setScalar(clamp(1-hgt*.12,.35,1));HERO.sh.material.opacity=clamp(1-hgt*.1,.3,1);
 // 环境
 todCur=damp(todCur,todTarget,.6,dt);applyTOD(todCur);waterU.uT.value=T;windU.value=T;playerU.value.copy(P.pos);
 for(const c of conveyors)c.tex.offset.x-=c.spd*dt/1.2;for(const f of fans)f.blades.rotation.y+=dt*12;
 for(const s of springs){s.sq=Math.max(0,s.sq-dt*4);s.top.position.y=.45-Math.sin(s.sq*Math.PI)*.15}
 for(const it of items){if(!it.grp.visible)continue;it.model.rotation.y+=dt*1.6;it.model.position.y=Math.sin(T*2.4)*.12;it.ring.scale.setScalar(1+Math.sin(T*3)*.08);it.beacon.material.opacity=.2}
 const dmc=coinDummy;for(let i=0;i<coinState.length;i++){const c=coinState[i];if(c.got)continue;dmc.position.set(c.p[0],c.p[1]+Math.sin(T*3+i)*.06,c.p[2]);dmc.rotation.set(0,T*3+i,0);dmc.scale.setScalar(1);dmc.updateMatrix();coins.setMatrixAt(i,dmc.matrix)}coins.instanceMatrix.needsUpdate=true;
 for(const c of skyClouds){c.position.x+=c.userData.spd*dt;if(c.position.x>180)c.position.x=-180}
 beaconMat.opacity=.16+Math.sin(T*3)*.05;
 if(boss.grp.visible){boss.grp.position.set(boss.state==='tele'?boss.grp.position.x:boss.pos.x,boss.pos.y,boss.pos.z);boss.grp.scale.setScalar(boss.scale);boss.grp.rotation.y=Math.atan2(-(P.pos.x-boss.pos.x),-(P.pos.z-boss.pos.z));
  boss.blob.position.set(boss.pos.x,.06,boss.pos.z);boss.blob.scale.setScalar(boss.scale*clamp(1.4-boss.pos.y*.1,.4,1.2));WEAK_MAT.emissive.setHex(boss.expose?0x8a6a00:0x000000);boss.clock.position.y=2+(boss.expose?Math.sin(T*20)*.08:0);boss.hand.rotation.z=-T*3;
  BOSS_MAT.color.set(boss.state==='tele'||boss.state==='charge'?0x6a3040:0x3e3550).convertSRGBToLinear()}
 const dusk=todCur>2.2;lampGlow.forEach(l=>l.material.color.setHex(dusk?0xffd890:0xfff8e0));if(dusk&&Math.random()<.25)GLOW.emit(P.pos.x+rnd(-12,12),rnd(.5,3),P.pos.z+rnd(-12,12),rnd(-.3,.3),rnd(-.1,.3),rnd(-.3,.3),0xd8ff8a,.35,3);
 FX.update(dt);GLOW.update(dt);
 sun.position.set(P.pos.x+skyU.sunDir.value.x*40,skyU.sunDir.value.y*40+5,P.pos.z+skyU.sunDir.value.z*40);sun.target.position.set(P.pos.x,P.pos.y,P.pos.z);sun.target.updateMatrixWorld();
 sky.position.copy(camera.position);
 updateCamera(rdt*Math.min(1,slowmo+.3));if(composer)composer.render(rdt);else renderer.render(scene,camera)}catch(e){__err(e)}}
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();toast('画面恢复中…',3000)});
P.yaw=0;camYaw=0;applyTOD(0);updateHUD();
try{renderer.compile(scene,camera)}catch(e){}
requestAnimationFrame(frame);

document.getElementById('photo').style.backgroundImage='url('+HEADS+')';
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),500)},300);
}catch(e){__err(e)}
</script></body></html>
